/* ===== Состояние и роутинг ===== */
const S={lang:'ru',route:'home',b:{step:0},t:{i:0,a:[]},auth:false,tab:'dash'};
const $=s=>document.querySelector(s),tr=k=>T[S.lang][k],nm=o=>o[S.lang];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(r,sv){S.route=r;if(r==='book'){S.b={step:sv?1:0,svc:sv||null}}if(r==='test')S.t={i:0,a:[]};scrollTo(0,0);draw()}
function lang(l){S.lang=l;document.documentElement.lang=l;draw()}
function wa(txt){return 'https://wa.me/'+CLINIC.wa+'?text='+encodeURIComponent(tr('wa')+txt)}
const svc=id=>services.find(s=>s.id===id),doc=id=>doctors.find(d=>d.id===id);

/* ===== Страницы ===== */
const P={
home(){return `<div class="wrap"><div class="hero"><div><span class="pill">BetaLife · Душанбе</span><h1>${tr('h1')}</h1><p class="muted" style="font-size:1.1rem">${tr('sub')}</p>
<div class="row"><button class="btn p" onclick="go('book')">${tr('cta1')}</button><button class="btn" onclick="go('services')">${tr('cta2')}</button></div></div><div class="art">✚</div></div>
<div class="grid">${tr('adv').map(a=>`<div class="card"><b>✓ ${a}</b></div>`).join('')}</div></div>
<section class="wrap"><h2>${tr('pop')}</h2><div class="grid">${services.slice(0,4).map(card).join('')}</div></section>
<section class="wrap"><h2>${tr('team')}</h2><div class="grid">${doctors.slice(0,3).map(dcard).join('')}</div></section>
<section class="wrap"><h2>${tr('rev')}</h2><div class="grid">${reviews.map(r=>`<div class="card"><p>“${nm(r.t)}”</p><b>${r.n}</b></div>`).join('')}</div><p class="muted">${tr('demo')}</p></section>
<section class="wrap"><div class="card" style="text-align:center;background:var(--mist)"><h2>${tr('cta')}</h2><button class="btn p" onclick="go('book')">${tr('ctab')}</button></div></section>`},
services(){return `<div class="wrap"><section><h1 style="font-size:2.2rem">${tr('services')}</h1><p class="muted">${tr('demo')}</p><div class="grid">${services.map(card).join('')}</div></section></div>`},
doctors(){return `<div class="wrap"><section><h1 style="font-size:2.2rem">${tr('doctors')}</h1><p class="muted">${tr('demo')}</p><div class="grid">${doctors.map(dcard).join('')}</div></section></div>`},
book(){const b=S.b,st=b.step,L=tr('steps');let body='';
if(st===8)return `<div class="wrap" style="max-width:560px"><section><div class="card"><h2>✓</h2><p>${tr('ok')}</p><pre class="muted" style="white-space:pre-wrap">${tr('notif')}:\n${esc(b.name)} · ${esc(nm(svc(b.svc)))}\n${b.date} ${b.time}\n${esc(b.phone)}</pre><button class="btn p" onclick="go('home')">OK</button></div></section></div>`;
if(st===0)body=services.map(s=>`<button class="opt ${b.svc===s.id?'on':''}" onclick="S.b.svc=${s.id};S.b.step=1;draw()">${nm(s)} <span class="muted">· ${s.min} ${tr('min')}</span></button>`).join('');
if(st===1)body=doctors.map(d=>`<button class="opt ${b.doc===d.id?'on':''}" onclick="S.b.doc=${d.id};S.b.step=2;draw()">${d.n} <span class="muted">· ${nm(d.sp)}</span></button>`).join('');
if(st===2)body=`<input type="date" id="f" value="${b.date||''}" min="2026-10-05"><button class="btn p" onclick="need('f','date',3)">${tr('next')}</button>`;
if(st===3)body=`<div class="slots">${SLOTS.map(t=>`<button class="opt ${b.time===t?'on':''}" onclick="S.b.time='${t}';S.b.step=4;draw()">${t}</button>`).join('')}</div>`;
if(st===4)body=`<input id="f" placeholder="${tr('name')}" value="${esc(b.name||'')}" maxlength="60"><button class="btn p" onclick="need('f','name',5)">${tr('next')}</button>`;
if(st===5)body=`<input id="f" type="tel" placeholder="+992 ..." value="${esc(b.phone||'')}" maxlength="20"><button class="btn p" onclick="need('f','phone',6)">${tr('next')}</button>`;
if(st===6)body=`<textarea id="f" rows="3" maxlength="300" placeholder="${tr('comm')}">${esc(b.comment||'')}</textarea><button class="btn p" onclick="S.b.comment=$('#f').value;S.b.step=7;draw()">${tr('next')}</button>`;
if(st===7)body=`<div class="card"><b>${nm(svc(b.svc))}</b><br>${doc(b.doc).n}<br>${b.date} · ${b.time}<br>${esc(b.name)} · ${esc(b.phone)}</div><br><button class="btn p" onclick="submitBook()">${tr('send')}</button>`;
return `<div class="wrap" style="max-width:560px"><section><h2>${tr('book')}: ${L[st]}</h2><div class="prog"><i style="width:${(st+1)/8*100}%"></i></div>${body}${st>0?`<p><button class="btn" onclick="S.b.step--;draw()">${tr('back')}</button></p>`:''}</section></div>`},
test(){const t=S.t,q=tr('q');if(t.i>=q.length)return `<div class="wrap" style="max-width:560px"><section><div class="card"><h2>${tr('res')}</h2><div class="row"><button class="btn p" onclick="go('book',1)">${tr('tri')}</button><a class="btn wa" target="_blank" rel="noopener" href="${wa(nm(services[0]))}">${tr('contact')}</a></div></div></section></div>`;
const inp=t.i===0?`<input id="f" type="number" min="1" max="120" placeholder="25"><button class="btn p" onclick="ans($('#f').value)">${tr('next')}</button>`:(t.i===1?[['<3','<3'],['3–12','3–12'],['>12','>12']].map(o=>`<button class="opt" onclick="ans('${o[0]}')">${o[1]}</button>`).join(''):`<button class="opt" onclick="ans('y')">${tr('yes')}</button><button class="opt" onclick="ans('n')">${tr('no')}</button>`);
return `<div class="wrap" style="max-width:560px"><section><h2>${tr('tt')}</h2><div class="dis">${tr('disc')}</div><div class="prog"><i style="width:${t.i/10*100}%"></i></div><p><b>${t.i+1}/10. ${q[t.i]}</b></p>${inp}</section></div>`},
offer(){const o=O[S.lang];return `<div class="wrap"><section><h1 style="font-size:2.2rem">${o.t}</h1><p class="muted">${o.sub}</p><div class="grid">${PK.map(k=>`<div class="card" style="${k.pop?'border-color:var(--teal);border-width:2px':''}"><h3>${k.k}</h3><div class="kpi">${k.p} $</div><p class="muted">${k.w} ${o.wk}</p><ul style="padding-left:18px">${k.f[S.lang].map(x=>`<li>${x}</li>`).join('')}</ul><a class="btn p" style="width:100%" target="_blank" rel="noopener" href="https://wa.me/${DEV_WA}?text=${encodeURIComponent(o.msg+k.k)}">${o.pick}</a></div>`).join('')}</div><p>${o.sup}</p><p class="muted">${o.pay}<br>${o.extra}</p></section></div>`},
admin(){if(!S.auth)return `<div class="wrap" style="max-width:380px"><section><h2>${tr('login')}</h2><input id="pw" type="password" placeholder="${tr('pw')}"><button class="btn p" onclick="if($('#pw').value==='admin'){S.auth=true;draw()}">${tr('enter')}</button></section></div>`;
const tabs=['dash','clients','appts','docs','svcs','leads','stats'],lb={dash:tr('dash'),clients:tr('clients'),appts:tr('appts'),docs:tr('doctors'),svcs:tr('services'),leads:tr('leads'),stats:tr('stats')};
const nl=leads.filter(l=>l.status==='NEW').length,bk=clients.filter(c=>['BOOKED','COMPLETED'].includes(c.status)).length;
const tb=(h,rows)=>`<div class="scroll"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
const stt=s=>`<span class="st ${s}">${s}</span>`;let v='';
if(S.tab==='dash')v=`<div class="grid">${[[tr('newl'),nl],[tr('today'),appts.filter(a=>a.date==='2026-10-05').length],[tr('tom'),appts.filter(a=>a.date==='2026-10-06').length],[tr('clients'),clients.length],['CANCELLED',clients.filter(c=>c.status==='CANCELLED').length],['Test leads',leads.filter(l=>l.src==='test').length],[tr('conv'),Math.round(bk/clients.length*100)+'%']].map(k=>`<div class="card"><div class="kpi">${k[1]}</div><div class="muted">${k[0]}</div></div>`).join('')}</div>`;
if(S.tab==='clients')v=tb(['ID','Name','Phone','Service','Source','Created','Last','Status'],clients.map(c=>[c.id,c.name,c.phone,nm(svc(c.svc)),c.src,c.date,c.last,`<select onchange="clients.find(x=>x.id==${c.id}).status=this.value;draw()" style="margin:0;padding:6px">${STAT.map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select>`]));
if(S.tab==='appts')v=tb(['Client','Doctor','Service','Date','Time','Status'],appts.map(a=>[a.client,doc(a.doc).n,nm(svc(a.svc)),a.date,a.time,stt(a.status)]));
if(S.tab==='docs')v=`<div class="row"><input id="dn" placeholder="Name" style="max-width:240px"><input id="ds" placeholder="Specialty" style="max-width:200px"><button class="btn p" onclick="addDoc()">${tr('add')}</button></div>`+tb(['ID','Name','Specialty','Exp',''],doctors.map(d=>[d.id,d.n,nm(d.sp),d.exp,`<button class="btn" style="min-height:36px" onclick="doctors=doctors.filter(x=>x.id!==${d.id});draw()">${tr('del')}</button>`]));
if(S.tab==='svcs')v=`<div class="row"><input id="sn" placeholder="Service" style="max-width:260px"><button class="btn p" onclick="addSvc()">${tr('add')}</button></div>`+tb(['ID','Name','Min',''],services.map(s=>[s.id,nm(s),s.min,`<button class="btn" style="min-height:36px" onclick="services=services.filter(x=>x.id!==${s.id});draw()">${tr('del')}</button>`]));
if(S.tab==='leads')v=tb(['ID','Name','Source','Service','Status'],leads.map(l=>[l.id,l.name,l.src,nm(svc(l.svc)),stt(l.status)]));
if(S.tab==='stats'){const cnt=(arr,f)=>{const m={};arr.forEach(x=>m[f(x)]=(m[f(x)]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6)};
const bars=a=>`<div class="bars">${a.map(([k,n])=>`<div><span style="width:150px">${k}</span><i style="width:${n*28}px"></i>${n}</div>`).join('')}</div>`;
v=`<div class="grid"><div class="card"><h3>${tr('services')}</h3>${bars(cnt(appts,a=>nm(svc(a.svc))))}</div><div class="card"><h3>Sources</h3>${bars(cnt(clients,c=>c.src))}</div></div>`}
return `<div class="wrap"><section><div class="row" style="margin-bottom:16px">${tabs.map(x=>`<button class="btn ${S.tab===x?'p':''}" onclick="S.tab='${x}';draw()">${lb[x]}</button>`).join('')}</div>${v}</section></div>`}
};
function card(s){return `<div class="card"><h3>${nm(s)}</h3><p class="muted">${tr('dur')}: ${s.min} ${tr('min')}</p><div class="row"><button class="btn p" onclick="go('book',${s.id})">${tr('book')}</button><a class="btn wa" target="_blank" rel="noopener" href="${wa(nm(s))}">WA</a></div></div>`}
function dcard(d){return `<div class="card"><div class="av">${d.n[0]}</div><h3>${d.n}</h3><p class="muted">${nm(d.sp)} · ${d.exp} ${tr('exp')}</p><button class="btn p" onclick="go('book')">${tr('book')}</button></div>`}
function need(id,k,next){const v=$('#'+id).value.trim();if(!v){alert(tr('req'));return}if(k==='phone'&&!/^[+\d\s()-]{7,20}$/.test(v)){alert(tr('req'));return}S.b[k]=v;S.b.step=next;draw()}
function ans(v){if(v===''||v==null)return;S.t.a.push(v);S.t.i++;if(S.t.i>=10)leads.unshift({id:leads.length+1,name:'Test',src:'test',svc:2,status:'NEW'});draw()}
function submitBook(){const b=S.b;leads.unshift({id:leads.length+1,name:b.name,src:'site',svc:b.svc,status:'NEW'});appts.unshift({id:appts.length+1,client:b.name,doc:b.doc,svc:b.svc,date:b.date,time:b.time,status:'NEW'});b.step=8;draw()}
function addDoc(){const n=$('#dn').value.trim(),s=$('#ds').value.trim();if(!n||!s)return;doctors.push({id:Date.now(),n,sp:{ru:s,tj:s,en:s},exp:0});draw()}
function addSvc(){const n=$('#sn').value.trim();if(!n)return;services.push({id:Date.now(),ru:n,tj:n,en:n,min:30,slug:'new'});draw()}

/* ===== Рендер ===== */
function draw(){
 const r=S.route;$('#app').innerHTML=P[r]();
 $('#nav').innerHTML=['home','services','doctors','book','test','offer','admin'].map(x=>`<a class="${r===x?'on':''}" onclick="go('${x}')">${tr(x)}</a>`).join('');
 $('#lang').innerHTML=LANGS.map(l=>`<button class="${S.lang===l?'on':''}" onclick="lang('${l}')">${l.toUpperCase()}</button>`).join('');
 $('#fab').href=wa('');
 $('#foot').innerHTML=`<b>BetaLife Medical Center</b><br>${tr('addr')}<br>${CLINIC.phone} · <a style="color:#7FD1CC" href="${CLINIC.ig}" target="_blank" rel="noopener">Instagram</a><br>${tr('hours')}`;
}
draw();
</script>
</body>
</html>
