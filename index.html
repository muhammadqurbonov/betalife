function docs(){return`<div class="card"><h2>${tr('doctors')}</h2><div class="row"><input id="dn" placeholder="Name" style="max-width:240px"><input id="ds" placeholder="Specialty" style="max-width:220px"><button class="btn p" onclick="addDoc()">${tr('add')}</button></div><div class="table-wrap"><table><tr><th>ID</th><th>Name</th><th>Specialty</th><th>Exp</th><th>${tr('actions')}</th></tr>${doctors.map(d=>`<tr><td>${d.id}</td><td>${esc(d.n)}</td><td>${esc(nm(d.sp))}</td><td>${d.exp}</td><td><button class="btn danger small" onclick="archiveDoc(${d.id})">${tr('archive')}</button></td></tr>`).join('')}</table></div></div>`}
function stats(){let count=(a,f)=>{let m={};a.forEach(x=>{let k=f(x);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])},bars=a=>{let max=Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div class="bar-row"><span>${esc(x[0])}</span><div class="bar"><i style="width:${x[1]/max*100}%"></i></div><b>${x[1]}</b></div>`).join('')||tr('noData')};return`<div class="grid"><div class="card"><h3>${tr('service')}</h3>${bars(count(DB.appts,x=>nm(svc(x.svc))))}</div><div class="card"><h3>${tr('source')}</h3>${bars(count(DB.leads,x=>source(x.src)))}</div><div class="card"><h3>${tr('status')}</h3>${bars(count(DB.appts,x=>x.status))}</div></div>`}
function openClient(id){let c=DB.clients.find(x=>x.id===id);if(!c)return;let h=DB.appts.filter(a=>a.clientId===id||a.client===c.name);$('#modal').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row"><div style="margin-right:auto"><span class="pill">${c.id}</span><h2>${esc(c.name)}</h2></div><button class="btn small" onclick="closeModal()">×</button></div><div class="grid"><div class="card"><p>📞 <b>${esc(c.phone)}</b></p><p>${tr('service')}: <b>${esc(nm(svc(c.svc)))}</b></p><p>${tr('source')}: <b>${source(c.src)}</b></p><p>${tr('status')}: ${status(c.status)}</p><div class="row"><a class="btn wa small" href="${wa(nm(svc(c.svc)))}" target="_blank">WhatsApp</a><a class="btn small" href="tel:${esc(c.phone)}">${tr('call')}</a></div><select id="cs"><option>NEW</option><option>CONTACTED</option><option>BOOKED</option><option>COMPLETED</option><option>CANCELLED</option></select><button class="btn p" onclick="saveClient('${c.id}')">${tr('save')}</button></div><div><h3>${tr('history')}</h3>${h.map(a=>`<p><b>${a.date} · ${a.time}</b><br>${esc(nm(svc(a.svc)))}<br><span class="muted">${esc(doc(a.doc)?.n||'—')} · ${status(a.status)}</span></p>`).join('')||`<p>${tr('noData')}</p>`}</div></div></div></div>`;setTimeout(()=>$('#cs').value=c.status,0)}function closeModal(){$('#modal').innerHTML=''}function saveClient(id){let c=DB.clients.find(x=>x.id===id);c.status=$('#cs').value;save();closeModal();draw()}function updateAppt(id,v){let a=DB.appts.find(x=>x.id===id);a.status=v;let c=DB.clients.find(x=>x.id===a.clientId);if(c)c.status=v==='COMPLETED'?'COMPLETED':v==='BOOKED'?'BOOKED':c.status;save();draw()}function updateLead(id,v){let l=DB.leads.find(x=>x.id===id);l.status=v;save();draw()}function addDoc(){let n=$('#dn').value.trim(),s=$('#ds').value.trim();if(!n||!s)return;doctors.push({id:Date.now(),n,sp:{ru:s,tj:s,en:s},exp:0});draw()}function archiveDoc(id){if(DB.appts.some(a=>a.doc===id&&!['CANCELLED','COMPLETED'].includes(a.status))){alert('Есть активные записи. Сначала завершите или отмените их.');return}let d=doctors.find(x=>x.id===id);if(d){DB.archivedDoctors.push(d);doctors.splice(doctors.findIndex(x=>x.id===id),1);save();draw()}}function resetDemo(){if(confirm(tr('resetConfirm'))){DB=seed();save();S.tab='dash';draw();toast('DEMO reset')}}
function draw(){if(S.route==='admin'&&!S.auth)$('#app').innerHTML=P.admin();else $('#app').innerHTML=P[S.route]();$('#nav').innerHTML=['home','services','doctors','book','test','offer','admin'].map(x=>`<button class="${S.route===x?'on':''}" onclick="go('${x}')">${tr(x)}</button>`).join('');$('#lang').innerHTML=LANGS.map(l=>`<button class="${S.lang===l?'on':''}" onclick="lang('${l}')">${l.toUpperCase()}</button>`).join('');$('#fab').href=wa('');$('#foot').innerHTML=`<b>BetaLife Medical Center</b><br>${tr('addr')}<br>${CLINIC.phone} · <a style="color:#7fd1cc" href="https://www.instagram.com/betalife.medical.center" target="_blank">Instagram</a><br>${tr('hours')}<br><small>${tr('demo')}</small><br><a href="?admin=1" style="display:inline-block;margin-top:12px;color:#7fd1cc;font-weight:800;text-decoration:none">🔐 Вход для персонала / CRM</a>`}if(new URLSearchParams(location.search).get('admin')==='1')S.route='admin';draw();
</script></body></html>
